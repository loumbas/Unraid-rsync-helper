<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background -->
    <linearGradient id="rd-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e232a" />
      <stop offset="100%" stop-color="#121519" />
    </linearGradient>

    <!-- Colors -->
    <linearGradient id="rd-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7334" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="rd-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="rd-white" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <filter id="rd-drop" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#rd-bg)" stroke="#313947" stroke-width="3" filter="url(#rd-drop)" />

  <!-- Rclone Official Geometry with Refined Duotone Finish -->
  <g transform="translate(38, 28) scale(0.85)" filter="url(#rd-drop)">
